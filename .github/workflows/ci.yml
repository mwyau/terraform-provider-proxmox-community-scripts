name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.7'
      - name: Resolve modules
        run: go mod tidy
      - name: Check committed Go formatting
        run: test -z "$(gofmt -l main.go internal/ cmd/)"
      - name: Verify dependency checksums
        run: git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Check normalized contract against Ansible feature branch
        run: python3 scripts/check_ansible_contract.py
      - uses: hashicorp/setup-terraform@v3
      - name: Validate Terraform examples against development provider
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-provider"
          go build -o "$RUNNER_TEMP/local-provider/terraform-provider-proxmox-community-scripts" .
          cat > "$RUNNER_TEMP/dev.tfrc" <<EOF
          provider_installation {
            dev_overrides {
              "mwyau/proxmox-community-scripts" = "$RUNNER_TEMP/local-provider"
            }
            direct {}
          }
          EOF
          export TF_CLI_CONFIG_FILE="$RUNNER_TEMP/dev.tfrc"
          for source in examples/lifecycle.tf examples/import.tf; do
            mkdir -p "$RUNNER_TEMP/validate-example"
            cp "$source" "$RUNNER_TEMP/validate-example/main.tf"
            (cd "$RUNNER_TEMP/validate-example" && terraform init -backend=false -input=false >/dev/null && terraform validate)
            rm -rf "$RUNNER_TEMP/validate-example"
          done
          mkdir -p "$RUNNER_TEMP/plan-verify"
          cp examples/plan-verify.tf "$RUNNER_TEMP/plan-verify/main.tf"
          (cd "$RUNNER_TEMP/plan-verify" && terraform init -backend=false -input=false >/dev/null && terraform plan -input=false -lock=false -no-color > "$RUNNER_TEMP/plan-result.txt")
          grep -q 'communityscripts_guest.inspect_only' "$RUNNER_TEMP/plan-result.txt"




  normalize-once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/go-provider-foundation'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.7'
      - name: Commit gofmt after bpg naming refactor
        run: |
          set -euo pipefail
          go mod tidy
          gofmt -w main.go internal/ cmd/
          git add go.mod go.sum main.go internal/ cmd/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Format bpg-compatible provider API'
          git push origin HEAD:feat/go-provider-foundation
